<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; align-items:center; gap:18px; padding:0 28px; height:64px; background:#0A2033; border-bottom:1px solid #1B3A55; font-family:'Plus Jakarta Sans', sans-serif; color:#EAF0F5;">
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="width:28px; height:28px; border-radius:7px; background:linear-gradient(140deg,#3FBE84,#1D7E8C); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:#04121D;">C</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-0.01em;">CSSEC</div>
    <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; color:#7B9AB2; border-left:1px solid #1F4162; padding-left:10px;">FGCU</div>
  </div>
  <div style="display:flex; gap:4px; align-items:stretch; height:64px;">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
      <div style="{{ it.style }}">{{ it.label }}</div>
    </sc-for>
  </div>
  <div style="flex:1;"></div>
  <div style="display:flex; align-items:center; gap:9px; background:#0C2841; border:1px solid #1F4162; border-radius:8px; padding:7px 11px; width:222px; flex-shrink:0;">
    <span style="color:#7B9AB2; font-size:13.5px; white-space:nowrap;">Search CSSEC</span>
    <span style="flex:1;"></span>
    <span style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#8FAEC6; border:1px solid #27527A; border-radius:4px; padding:2px 5px;">⌘K</span>
  </div>
  <div style="display:flex; gap:14px; font-size:13.5px; color:#9FB8CB; flex-shrink:0; white-space:nowrap;">
    <div>Discord</div>
    <div>GitHub</div>
  </div>
  <div style="background:#2FA36B; color:#04231A; font-size:13.5px; font-weight:700; padding:9px 16px; border-radius:8px; flex-shrink:0; white-space:nowrap;">Join CSSEC</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Events&quot;,&quot;Projects&quot;,&quot;Resources&quot;,&quot;Opportunities&quot;,&quot;About&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "Home";
    const base = "display:flex; align-items:center; padding:0 10px; font-size:14px; font-weight:500; white-space:nowrap; flex-shrink:0;";
    return {
      items: ["Home","Events","Projects","Resources","Opportunities","About"].map(label => ({
        label,
        style: label === active
          ? base + " color:#FFFFFF; font-weight:600; box-shadow:inset 0 -2px 0 #2FA36B;"
          : base + " color:#A9C0D2;"
      }))
    };
  }
}

</script>
</body>
</html>
